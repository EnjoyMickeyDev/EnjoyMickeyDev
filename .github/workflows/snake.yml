name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: EnjoyMickeyDev
          outputs: |
            dist/snake.svg?color_snake=#f2b134&color_dots=#f6f8fa,#ebdfc5,#d8bf86,#a8863b,#f2b134
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2b134&color_dots=#0d1117,#1f2630,#3a2f1a,#a8863b,#f2b134

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
